# Render Blueprint: the app and its database. Secrets are entered in the Render dashboard
# when the Blueprint is first created (sync: false), never stored here.
services:
  - type: web
    name: invoice-guard
    runtime: node
    # Free compute sleeps after 15 minutes without traffic and takes about a minute to wake.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-guard-db
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  # Paid, because Render deletes free databases after 30 days, before judging ends.
  # The smallest compute and disk; this app stores a few hundred rows at most.
  - name: invoice-guard-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: invoice_guard
    user: invoice_guard
